<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>보상및정보 | 아이리케어</title>
    <link rel="stylesheet" href="./app/globals.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="wrap topbar-inner">
        <a class="brand" href="./preview.html">
          <span class="brand-text">
            <strong class="brand-main">아이리케어</strong>
            <span class="brand-sub">내 보험, 다시 케어하다</span>
          </span>
        </a>
        <div class="topbar-actions">
          <a class="menu-link" href="./preview.html">홈</a>
          <a class="menu-link on" href="./preview-info.html">보상및정보</a>
          <a class="menu-link" href="./preview-board.html">게시판</a>
          <a class="nav-btn" href="./preview.html#join">입사문의</a>
        </div>
      </div>
    </header>

    <main class="info-page">
      <div class="wrap">
        <div class="info-head">
          <h1>보상및정보</h1>
          <p>고객의 권리를 찾아 드립니다</p>
        </div>

        <div class="info-toolbar">
          <div class="info-tabs" id="infoTabs">
            <button type="button" class="info-tab on" data-tab="전체">전체</button>
            <button type="button" class="info-tab" data-tab="보상">보상</button>
            <button type="button" class="info-tab" data-tab="정보">정보</button>
          </div>
          <label class="info-search">
            <span aria-hidden="true">🔍</span>
            <input id="infoQuery" type="search" placeholder="검색어를 입력하세요..." />
          </label>
        </div>

        <div class="info-grid" id="infoGrid">
          <a class="info-card" data-category="정보" data-title="암 진단비 청구했는데, 거절?" href="https://blog.naver.com/punditclass/224398888400" target="_blank" rel="noopener noreferrer">
            <div class="info-thumb green has-image">
              <span class="info-badge green">정보</span>
              <img src="./public/thumb-algi-bosang.jpg" alt="암 진단비 청구했는데, 거절?" />
            </div>
            <div class="info-meta"><span>📅 2026-09-03</span><span>🏷 정보</span></div>
          </a>
        </div>
        <p class="info-empty" id="infoEmpty" hidden>해당하는 글이 없습니다.</p>
      </div>
    </main>
    <script>
      var tab = "전체";
      var query = "";
      function applyFilter() {
        var cards = document.querySelectorAll(".info-card");
        var shown = 0;
        cards.forEach(function (card) {
          var cat = card.getAttribute("data-category");
          var title = card.getAttribute("data-title") || "";
          var okTab = tab === "전체" || cat === tab;
          var okQuery = !query || title.indexOf(query) !== -1 || cat.indexOf(query) !== -1;
          var show = okTab && okQuery;
          card.hidden = !show;
          card.classList.remove("slide-in-left", "slide-in-right", "slide-in-fade");
          if (show) {
            var slide = shown % 3 === 0 ? "slide-in-left" : shown % 3 === 2 ? "slide-in-right" : "slide-in-fade";
            void card.offsetWidth;
            card.classList.add(slide);
            shown += 1;
          }
        });
        document.getElementById("infoEmpty").hidden = shown !== 0;
      }
      document.getElementById("infoTabs").addEventListener("click", function (e) {
        var btn = e.target.closest(".info-tab");
        if (!btn) return;
        tab = btn.getAttribute("data-tab");
        document.querySelectorAll(".info-tab").forEach(function (item) {
          item.classList.toggle("on", item === btn);
        });
        applyFilter();
      });
      document.getElementById("infoQuery").addEventListener("input", function (e) {
        query = e.target.value.trim();
        applyFilter();
      });
      applyFilter();
    </script>
  </body>
</html>
